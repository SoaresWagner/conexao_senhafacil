name: Build Android (Conexao Senha Facil)

on:
  workflow_dispatch:

env:
  RUST_VERSION: "1.75"
  CARGO_NDK_VERSION: "3.1.2"
  FLUTTER_VERSION: "3.24.5"
  ANDROID_FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.5.1"
  NDK_VERSION: "r28c"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-android-abi:
    name: build android ${{ matrix.job.arch }}
    needs: [generate-bridge]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        job:
          - {
              arch: arm64-v8a,
              target: aarch64-linux-android,
              flutter_target: android-arm64,
              ndk_script: ./flutter/ndk_arm64.sh,
              lib_sysroot_dir: aarch64-linux-android,
            }
          - {
              arch: armeabi-v7a,
              target: armv7-linux-androideabi,
              flutter_target: android-arm,
              ndk_script: ./flutter/ndk_arm.sh,
              lib_sysroot_dir: arm-linux-androideabi,
            }

    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
               clang \
               cmake \
               curl \
               gcc-multilib \
               git \
               g++ \
               g++-multilib \
               libayatana-appindicator3-dev \
               libasound2-dev \
               libc6-dev \
               libclang-dev \
               libunwind-dev \
               libgstreamer1.0-dev \
               libgstreamer-plugins-base1.0-dev \
               libgtk-3-dev \
               libpulse-dev \
               libva-dev \
               libxcb-randr0-dev \
               libxcb-shape0-dev \
               libxcb-xfixes0-dev \
               libxdo-dev \
               libxfixes-dev \
               llvm-dev \
               nasm \
               ninja-build \
               openjdk-17-jdk-headless \
               pkg-config \
               tree \
               wget

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Customize hbb_common config (White-Label)
        shell: bash
        run: |
          python3 -c "
          with open('libs/hbb_common/src/config.rs', 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('\"RustDesk\".to_owned()', '\"ConexaoSenhaFacil\".to_owned()')
          c = c.replace('&[\"rs-ny.rustdesk.com\"]', '&[\"conexao.senhafacil.app.br:21116\"]')
          c = c.replace('\"OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=\"', '\"kHd84DVEmqHbarZxFFMhxvVQh1V9QL9ZqMVW0dIAEbM=\"')
          with open('libs/hbb_common/src/config.rs', 'w', encoding='utf-8') as f:
              f.write(c)
          "
          echo "=== Verificando libs/hbb_common/src/config.rs ==="
          grep -E "APP_NAME|RENDEZVOUS_SERVERS|RS_PUB_KEY" libs/hbb_common/src/config.rs

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1
        id: setup-ndk
        with:
          ndk-version: ${{ env.NDK_VERSION }}
          add-to-path: true

      - name: Setup vcpkg with Github Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11
        with:
          vcpkgDirectory: /opt/artifacts/vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! ./flutter/build_android_deps.sh "${{ matrix.job.arch }}"; then
            find "${VCPKG_ROOT}/" -name "*.log" | while read -r _1; do
              echo "$_1:"
              echo "======"
              cat "$_1"
              echo "======"
              echo ""
            done
            exit 1
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: "rustfmt"

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          prefix-key: rustdesk-lib-cache-android
          key: ${{ matrix.job.target }}

      - name: Build rustdesk lib
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          rustup target add ${{ matrix.job.target }}
          cargo install cargo-ndk --version ${{ env.CARGO_NDK_VERSION }} --locked
          ${{ matrix.job.ndk_script }}
          mkdir -p ./flutter/android/app/src/main/jniLibs/${{ matrix.job.arch }}
          cp ./target/${{ matrix.job.target }}/release/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/${{ matrix.job.arch }}/librustdesk.so
          cp ${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.lib_sysroot_dir }}/libc++_shared.so ./flutter/android/app/src/main/jniLibs/${{ matrix.job.arch }}/

      - name: Upload Rustdesk library to Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: librustdesk.so.${{ matrix.job.target }}
          path: ./target/${{ matrix.job.target }}/release/liblibrustdesk.so

      - name: Upload libc++_shared to Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: libc++_shared.so.${{ matrix.job.target }}
          path: ${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/${{ matrix.job.lib_sysroot_dir }}/libc++_shared.so

      - name: Build APK (${{ matrix.job.arch }})
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          if [ ! -f ./flutter/android/key.properties ]; then
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          fi
          pushd flutter
          flutter build apk --release --target-platform ${{ matrix.job.flutter_target }} --split-per-abi
          popd
          mkdir -p ./Output
          mv ./flutter/build/app/outputs/flutter-apk/app-${{ matrix.job.arch }}-release.apk ./Output/ConexaoSenhaFacil-${{ env.VERSION }}-${{ matrix.job.arch }}.apk

      - name: Upload APK (${{ matrix.job.arch }})
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ConexaoSenhaFacil-${{ env.VERSION }}-${{ matrix.job.arch }}
          path: ./Output/ConexaoSenhaFacil-${{ env.VERSION }}-${{ matrix.job.arch }}.apk

  build-android-universal:
    name: build android universal apk
    needs: [build-android-abi]
    runs-on: ubuntu-24.04
    steps:
      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: false
          android: false
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk-headless clang cmake ninja-build

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Customize hbb_common config (White-Label)
        shell: bash
        run: |
          python3 -c "
          with open('libs/hbb_common/src/config.rs', 'r', encoding='utf-8') as f:
              c = f.read()
          c = c.replace('\"RustDesk\".to_owned()', '\"ConexaoSenhaFacil\".to_owned()')
          c = c.replace('&[\"rs-ny.rustdesk.com\"]', '&[\"conexao.senhafacil.app.br:21116\"]')
          c = c.replace('\"OeVuKk5nlHiXp+APNn0Y3pC1Iwpwn44JGqrQCsWqmBw=\"', '\"kHd84DVEmqHbarZxFFMhxvVQh1V9QL9ZqMVW0dIAEbM=\"')
          with open('libs/hbb_common/src/config.rs', 'w', encoding='utf-8') as f:
              f.write(c)
          "
          echo "=== Verificando libs/hbb_common/src/config.rs ==="
          grep -E "APP_NAME|RENDEZVOUS_SERVERS|RS_PUB_KEY" libs/hbb_common/src/config.rs

      - name: Install flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: "stable"
          flutter-version: ${{ env.ANDROID_FLUTTER_VERSION }}

      - name: Patch flutter
        run: |
          cd $(dirname $(dirname $(which flutter)))
          if [[ "3.24.5" == ${{env.ANDROID_FLUTTER_VERSION}} ]]; then
            git apply ${{ github.workspace }}/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff
          fi

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Download Rustdesk library arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librustdesk.so.aarch64-linux-android
          path: ./flutter/android/app/src/main/jniLibs/arm64-v8a

      - name: Download libc++_shared arm64
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libc++_shared.so.aarch64-linux-android
          path: ./flutter/android/app/src/main/jniLibs/arm64-v8a

      - name: Download Rustdesk library armv7
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: librustdesk.so.armv7-linux-androideabi
          path: ./flutter/android/app/src/main/jniLibs/armeabi-v7a

      - name: Download libc++_shared armv7
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: libc++_shared.so.armv7-linux-androideabi
          path: ./flutter/android/app/src/main/jniLibs/armeabi-v7a

      - name: Build Universal APK
        shell: bash
        env:
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: |
          export PATH=/usr/lib/jvm/java-17-openjdk-amd64/bin:$PATH
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" ./flutter/android/gradle.properties
          if [ ! -f ./flutter/android/key.properties ]; then
            sed -i "s/signingConfigs.release/signingConfigs.debug/g" ./flutter/android/app/build.gradle
          fi
          mv ./flutter/android/app/src/main/jniLibs/arm64-v8a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/arm64-v8a/librustdesk.so
          mv ./flutter/android/app/src/main/jniLibs/armeabi-v7a/liblibrustdesk.so ./flutter/android/app/src/main/jniLibs/armeabi-v7a/librustdesk.so
          pushd flutter
          # 1. Gera o APK Universal (para instalacao direta em qualquer celular)
          flutter build apk --release --target-platform android-arm,android-arm64
          # 2. Gera o Android App Bundle (.aab) para a Google Play Store
          flutter build appbundle --release
          popd
          mkdir -p ./Output
          mv ./flutter/build/app/outputs/flutter-apk/app-release.apk ./Output/ConexaoSenhaFacil-${{ env.VERSION }}-universal.apk
          mv ./flutter/build/app/outputs/bundle/release/app-release.aab ./Output/ConexaoSenhaFacil-${{ env.VERSION }}.aab

      - name: Upload Universal APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ConexaoSenhaFacil-${{ env.VERSION }}-universal
          path: ./Output/ConexaoSenhaFacil-${{ env.VERSION }}-universal.apk

      - name: Upload Play Store Bundle (AAB)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ConexaoSenhaFacil-${{ env.VERSION }}-PlayStore-Bundle
          path: ./Output/ConexaoSenhaFacil-${{ env.VERSION }}.aab

      - name: Upload Keystore Backup
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ConexaoSenhaFacil-PlayStore-Keystore-Backup
          path: |
            flutter/android/key.properties
            flutter/android/app/upload-keystore.jks
